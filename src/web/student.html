<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Helper · Student</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <h1 id="who">My work <span class="sub" id="section"></span></h1>
      <button id="logout">Sign out</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="work" class="active">Required work</button>
      <button data-tab="levels">LEVELS</button>
      <button data-tab="claims">Effort claims</button>
      <button data-tab="grades">My grades</button>
    </nav>
    <p class="foot muted small">Student view</p>
  </aside>
  <main class="content"><section id="view"></section></main>
</div>
<script type="module" src="/js/student/main.js"></script>
</body>
</html>
