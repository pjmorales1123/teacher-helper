<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Helper · Teacher</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <h1>Teacher Helper <span class="sub" id="ai-backend"></span></h1>
      <button id="logout">Sign out</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="grading">To check</button>
      <button data-tab="activities">Activities</button>
      <button data-tab="claims">Effort claims</button>
      <button data-tab="grades">Grades</button>
      <button data-tab="students">Students</button>
    </nav>
    <p class="foot muted small">Teacher view</p>
  </aside>
  <main class="content">
    <div id="notice"></div>
    <section id="view"></section>
  </main>
</div>
<script type="module" src="/js/teacher/main.js"></script>
</body>
</html>
